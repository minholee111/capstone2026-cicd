<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 로그인</title>
</head>
<body>
<h2>회원 로그인(학사A-이민호)</h2>

<div>
    <label for="userId"></label><input id="userId" type="text" placeholder="아이디">
    <br>
    <label for="password"></label><input id="password" type="password" placeholder="비밀번호">
    <br>
    <button type="button" onclick="handleLogin()">로그인</button>
</div>

<hr>

<h2>회원가입(학사A-이민호)</h2>

<div>
    <label for="regUserId"></label><input id="regUserId" type="text" placeholder="아이디">
    <br>
    <label for="regPassword"></label><input id="regPassword" type="password" placeholder="비밀번호">
    <br>
    <label for="regName"></label><input id="regName" type="text" placeholder="이름">
    <br>
    <button type="button" onclick="handleRegister()">회원가입</button>
</div>

<script src="login.js"></script>
<p><a href="projectInfo.html">프로젝트 소개</a></p>
</body>
</html>
