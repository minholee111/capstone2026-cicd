<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 로그인</title>
</head>
<body>
<h2>회원 로그인(학사A-이민호)</h2>

<div>
    <input id="userId" type="text" placeholder="아이디">
    <br>
    <input id="password" type="password" placeholder="비밀번호">
    <br>
    <button type="button" onclick="handleLogin()">로그인</button>
</div>

<hr>

<h2>회원가입(학사A-이민호)</h2>

<div>
    <input id="regUserId" type="text" placeholder="아이디">
    <br>
    <input id="regPassword" type="password" placeholder="비밀번호">
    <br>
    <input id="regName" type="text" placeholder="이름">
    <br>
    <button type="button" onclick="handleRegister()">회원가입</button>
</div>

<script src="login.js"></script>
</body>
</html>
